<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Lyy's web - BETA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="logo">Lyy's web - BETA</div>
      <a href="/" class="nav-link">Beranda</a>
      <a href="/semua-karya" class="nav-link">Semua Karya</a>
    </nav>
    <main class="content" id="app"></main>
  </div>

  <div class="player-bar">
    <div class="now-playing">
      <div class="cover-art" id="coverArt"></div>
      <div class="track-info">
        <div class="track-title" id="trackTitle">Belum ada lagu diputar</div>
        <div class="track-artist" id="trackArtist"></div>
      </div>
    </div>

    <div class="player-controls">
      <div class="player-buttons">
        <button id="btnPrev" class="player-btn"><span class="icon-prev"></span></button>
        <button id="btnPlay" class="player-btn play-btn"><span class="icon-play"></span></button>
        <button id="btnNext" class="player-btn"><span class="icon-next"></span></button>
      </div>
      <div class="progress-row">
        <span class="time-label" id="timeSekarang">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time-label" id="timeDurasi">0:00</span>
      </div>
    </div>

    <button id="btnQueue" class="player-btn"><span class="icon-queue"></span></button>

    <audio id="audioPlayer"></audio>
  </div>

  <div class="queue-panel" id="queuePanel"></div>

  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
