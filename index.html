<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ma Own Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="logo">Ma Own Web</div>
      <a href="index.html" class="nav-link active">Beranda</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </nav>
    <main class="content">
      <h1>Portofolio</h1>
      <p class="subtitle">Kumpulan karya foto pribadi.</p>
      <div class="portfolio-grid">
        <div class="portfolio-placeholder">Foto bakal muncul di sini</div>
      </div>
    </main>
  </div>

  <div class="player-bar">
    <div class="now-playing">
      <div class="cover-art"></div>
      <div class="track-info">
        <div class="track-title">Belum ada lagu diputar</div>
        <div class="track-artist"></div>
      </div>
    </div>
    <audio id="audioPlayer" controls></audio>
  </div>
</body>
</html>
