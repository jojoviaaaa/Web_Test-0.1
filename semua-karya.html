<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Semua Karya - Ma Own Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="logo">Ma Own Web</div>
      <a href="index.html" class="nav-link">Beranda</a>
      <a href="semua-karya.html" class="nav-link active">Semua Karya</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </nav>
    <main class="content">
      <h1>Semua Karya</h1>
      <p class="subtitle">Cari cepat lewat kata kunci atau kategori.</p>

      <div class="search-bar">
        <input type="text" id="inputCari" placeholder="Cari judul karya...">
      </div>

      <div class="kategori-pills" id="kategoriPills"></div>

      <div class="karya-grid" id="karyaGridSemua"></div>
    </main>
  </div>

  <div class="player-bar">
    <div class="now-playing">
      <div class="cover-art" id="coverArt"></div>
      <div class="track-info">
        <div class="track-title" id="trackTitle">Belum ada lagu diputar</div>
        <div class="track-artist" id="trackArtist"></div>
      </div>
    </div>

    <div class="player-controls">
      <div class="player-buttons">
        <button id="btnPrev" class="player-btn">⏮</button>
        <button id="btnPlay" class="player-btn play-btn">▶</button>
        <button id="btnNext" class="player-btn">⏭</button>
      </div>
      <div class="progress-row">
        <span class="time-label" id="timeSekarang">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time-label" id="timeDurasi">0:00</span>
      </div>
    </div>

    <audio id="audioPlayer"></audio>
  </div>

  <script src="player.js"></script>
  <script src="semua-karya.js"></script>
</body>
</html>
