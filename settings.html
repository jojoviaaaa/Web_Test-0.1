<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Settings - Ma Own Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="logo">Ma Own Web</div>
      <a href="index.html" class="nav-link">Beranda</a>
      <a href="settings.html" class="nav-link active">Settings</a>
    </nav>
    <main class="content">
      <h1>Settings</h1>
      <p class="subtitle">Upload dan kelola musik serta foto di sini.</p>

      <h2>Upload musik</h2>
      <input type="file" id="inputMusic" accept="audio/flac,audio/*">
      <p class="hint">Judul, artis, dan cover diambil otomatis dari file FLAC-nya.</p>

      <div id="songList" class="song-list"></div>
      <audio id="previewPlayer" controls class="preview-player"></audio>
    </main>
  </div>

  <script src="settings.js"></script>
</body>
</html>
